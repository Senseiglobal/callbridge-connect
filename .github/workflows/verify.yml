name: Verify CallBridge (no real calls)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/python/callbridge/requirements.txt
      - run: python -m unittest discover -s apps/python/callbridge -v
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: apps/typescript/callbridge-web
      - run: bunx tsc --noEmit
        working-directory: apps/typescript/callbridge-web
      - run: bun run build
        working-directory: apps/typescript/callbridge-web
        env:
          VITE_CALLBRIDGE_API_URL: /
      - run: docker build -t callbridge-test .
      - run: |
          docker run -d --name callbridge-test -p 8080:8080 callbridge-test
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8080/healthz; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/ > /dev/null
          curl --fail -X POST http://localhost:8080/api/demo -H 'Content-Type: application/json' -d '{}'
      - if: failure()
        run: docker logs callbridge-test || true
